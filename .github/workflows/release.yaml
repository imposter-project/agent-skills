name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pulls the entries for the most recent version out of CHANGELOG.md, so
      # the release body matches the curated changelog rather than a raw git log.
      - name: Extract changelog entries
        uses: release-tools/since@v0.21.2
        with:
          changelog-file: CHANGELOG.md
          output-file: version_changelog.md

      - name: Create release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const tag = context.ref.replace('refs/tags/', '');
            await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: tag,
              body: fs.readFileSync('version_changelog.md', 'utf8'),
              draft: false,
              prerelease: false,
            });
